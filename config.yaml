chunking:
  chunk_size: 300
  chunk_overlap: 50

models:
  embedding: intfloat/multilingual-e5-large
  reranker: BAAI/bge-reranker-v2-m3
  batch_size: 32
  
search:
  top_k: 10
  rerank_candidates: 50
  rrf_k: 30
  aggregation: max
  agg_top_k: 3        
  candidate_chunks: 100

paths:
  raw: data/candidate_public/candidate_data/articles.f
  calibration_raw: data/candidate_public/candidate_data/calibration.f
  test: data/candidate_public/candidate_data/test.f
  reports: reports/reports.md
  calibration: data/queries.jsonl
  processed_articles: data/processed.parquet
  bm25_index: indexes/bm25.pkl
  dense_index: indexes/
  logs: logs/logs.txt

