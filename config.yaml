chunking:
  chunk_size: 180
  chunk_overlap: 40

models:
  embedding: intfloat/multilingual-e5-large
  reranker: BAAI/bge-reranker-v2-m3
  batch_size: 64
  
search:
  top_k: 10
  rerank_candidates: 100
  rrf_k: 60
  aggregation: max
  agg_top_k: 3        
  candidate_chunks: 250

paths:
  raw: data/candidate_public/articles.f
  calibration_raw: data/candidate_public/calibration.f
  test: data/candidate_public/test.f
  calibration: data/queries.jsonl
  processed_articles: data/processed.parquet
  bm25_index: indexes/bm25.pkl
  dense_index: indexes/dense.pkl
  logs: logs/logs.txt
  answer: data/answer.csv

